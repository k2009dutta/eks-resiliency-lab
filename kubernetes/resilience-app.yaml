
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-app
  labels:
    app: resilience-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resilience-app
  template:
    metadata:
      labels:
        app: resilience-app
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: resilience-app
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: resilience-service
spec:
  type: ClusterIP
  selector:
    app: resilience-app
  ports:
    - port: 80
      targetPort: 80
